{{define "content"}}
<div class="page-title"><h1>Velos</h1><a class="button" href="/velo/velos/neu">Neues Velo</a></div>
{{template "velonav" "bikes"}}
{{if .Data.Bikes}}<div class="grid">
{{range .Data.Bikes}}<a class="module" href="/velo/velos/{{.ID}}"><span class="row">{{template "dot" .Color}}<b>{{.Name}}</b></span><span class="muted small">{{.Brand}} {{.Model}}</span><span>{{km .Km}} km · {{.Tours}} Touren</span></a>
{{end}}</div>{{else}}<p class="muted">Noch keine Velos.</p>{{end}}
{{end}}
