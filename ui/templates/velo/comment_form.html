{{define "content"}}
<div class="page-title"><h1>Kommentar {{.Data.Year}}</h1><a class="button secondary" href="/velo?jahr={{.Data.Year}}">Abbrechen</a></div>
<form class="stack wide" method="post" action="/velo/jahre/{{.Data.Year}}/kommentar">
<label>Kommentar<textarea name="comment" rows="10">{{.Data.Text}}</textarea><span class="hint">Markdown. Leer speichern entfernt den Kommentar.</span></label>
<div class="actions"><button class="button" type="submit">Speichern</button></div>
</form>
{{end}}
