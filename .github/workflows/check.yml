name: Check

# The full check; used by ci.yml and release.yml.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: go test
        run: go test -race ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          install-mode: goinstall

  validate:
    name: W3C validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - run: make validate

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      # Chrome is preinstalled on the runner (channel "chrome").
      - run: npx playwright test

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [test, lint, validate, e2e]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image (smoke test)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: allmend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
