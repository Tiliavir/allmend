name: Check

# The full check; used by ci.yml and release.yml.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/vendor/package-lock.json
      - run: make vendor
      - name: go test
        run: go test -race ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          # Prebuilt binary; building it from source took ~70 s per run.
          version: v2.15.0

  validate:
    name: W3C validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/vendor/package-lock.json
      - run: make vendor
      - run: make validate

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/vendor/package-lock.json
      - run: make vendor
      - run: npm ci --ignore-scripts
      # Chrome is preinstalled on the runner (channel "chrome").
      - run: npx playwright test

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image (smoke test)
        uses: docker/build-push-action@v7
        with:
          context: .
          # Both release platforms; arm64 is cross-compiled, no emulation.
          platforms: linux/amd64,linux/arm64
          push: false
          tags: allmend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
