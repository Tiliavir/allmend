version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Front-end libraries (ADR vendor-build); one PR per week for all of them.
  - package-ecosystem: "npm"
    directory: "/tools/vendor"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      vendor:
        patterns: ["*"]
